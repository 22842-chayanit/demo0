<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประวัติส่วนตัว | Chayanit Mangyasu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #4ea8de;
            --secondary-color: #90e0ef;
            --dark-color: #2b2d42;
            --bg-color: #f0f8ff;
            --card-bg: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--dark-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* การ์ดโปรไฟล์หลัก */
        .profile-card {
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(78, 168, 222, 0.15);
            width: 100%;
            max-width: 450px;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .profile-card:hover {
            transform: translateY(-5px);
        }

        /* ส่วนหัวของการ์ด (พื้นหลังสีฟ้า) */
        .profile-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            padding: 40px 20px;
            text-align: center;
            position: relative;
        }

        /* วงกลมรูปภาพจำลอง (สามารถเปลี่ยนใส่รูปจริงในภายหลังได้) */
        .profile-avatar {
            width: 110px;
            height: 110px;
            background: white;
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .profile-avatar i {
            font-size: 3.5rem;
            color: var(--primary-color);
        }

        .profile-header h1 {
            color: white;
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .profile-header p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.1rem;
            background: rgba(255, 255, 255, 0.2);
            display: inline-block;
            padding: 4px 16px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
        }

        /* ส่วนรายละเอียดข้อมูล */
        .profile-body {
            padding: 30px 25px;
        }

        .info-item {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #edf2f7;
        }

        .info-item:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        .icon-box {
            width: 45px;
            height: 45px;
            background-color: #e0f2fe;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 15px;
            transition: all 0.3s ease;
        }

        .info-item:hover .icon-box {
            background-color: var(--primary-color);
        }

        .info-item:hover .icon-box i {
            color: white;
        }

        .icon-box i {
            font-size: 1.2rem;
            color: var(--primary-color);
        }

        .info-content .label {
            font-size: 0.85rem;
            color: #718096;
            display: block;
            margin-bottom: 2px;
        }

        .info-content .value {
            font-size: 1.05rem;
            font-weight: 400;
            color: var(--dark-color);
        }

        /* ตกแต่งส่วนสีที่ชอบเป็นพิเศษ */
        .color-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .color-dot {
            width: 14px;
            height: 14px;
            background-color: #3a86ff; /* สีฟ้า */
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 5px rgba(58, 134, 255, 0.5);
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <div class="profile-header">
            <div class="profile-avatar">
                <i class="fa-solid fa-user-astronaut"></i>
            </div>
            <h1>ชญานิศ มังยะสุ</h1>
            <p>ชื่อเล่น: โบนัส</p>
        </div>

        <div class="profile-body">
            
            <div class="info-item">
                <div class="icon-box">
                    <i class="fa-solid fa-cake-candles"></i>
                </div>
                <div class="info-content">
                    <span class="label">วันเกิด</span>
                    <span class="value">14 ตุลาคม 2554</span>
                </div>
            </div>

            <div class="info-item">
                <div class="icon-box">
                    <i class="fa-solid fa-utensils"></i>
                </div>
                <div class="info-content">
                    <span class="label">อาหารที่ชอบ</span>
                    <span class="value">กะเพรา 🍳</span>
                </div>
            </div>

            <div class="info-item">
                <div class="icon-box">
                    <i class="fa-solid fa-palette"></i>
                </div>
                <div class="info-content">
                    <span class="label">สีที่ชอบ</span>
                    <span class="value class-color-text">
                        <div class="color-badge">
                            สีฟ้า <span class="color-dot"></span>
                        </div>
                    </span>
                </div>
            </div>

            <div class="info-item">
                <div class="icon-box">
                    <i class="fa-solid fa-user-group"></i>
                </div>
                <div class="info-content">
                    <span class="label">เพื่อนสนิท</span>
                    <span class="value">พอมแพม 🎀</span>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
