<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประวัติส่วนตัว | Chayanit Mangyasu</title>

    <style>
        :root {
            --primary-color: #4ea8de;
            --secondary-color: #90e0ef;
            --dark-color: #2b2d42;
            --bg-color: #f0f8ff;
            --card-bg: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--dark-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* การ์ดโปรไฟล์หลัก */
        .profile-card {
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(78, 168, 222, 0.15);
            width: 100%;
            max-width: 450px;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .profile-card:hover {
            transform: translateY(-5px);
        }

        /* ส่วนหัวของการ์ด (พื้นหลังสีฟ้า) */
        .profile-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            padding: 40px 20px;
            text-align: center;
            position: relative;
        }

        /* วงกลมรูปภาพจำลอง (สามารถเปลี่ยนใส่รูปจริงในภายหลังได้) */
        .profile-avatar {
            width: 110px;
            height: 110px;
            background: white;
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .profile-avatar i {
            font-size: 3.5rem;
            color: var(--primary-color);
        }

        .profile-header h1 {
            color: white;
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .profile-header p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.1rem;
            background: rgba(255, 255, 255, 0.2);
